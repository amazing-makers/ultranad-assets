<style>
/* ═══════════════════════════════════════════════════════════
   ULTRA NAD+ 위젯 공통 스타일
   모든 선택자를 .unad 안으로 가둬 아임웹 테마와 서로 간섭하지 않게 했습니다.
   ═══════════════════════════════════════════════════════════ */
.unad{
  --ink:#03080F; --ink2:#060E1D;
  --blue:#2A55B1; --blue-lt:#6BA6F5; --cyan:#7FD6EA; --green:#5BC47E;
  --violet:#A98BE6; --violet-dp:#6E4FB8;
  --tx:#EAF1FB; --tx-mut:#8FA4C4; --tx-dim:#566B8E;
  --line:rgba(150,185,240,.14);
  --kr:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --en:'Sora','Helvetica Neue',Arial,sans-serif;
  --gut:clamp(22px,6vw,90px);
  --ease:cubic-bezier(.16,1,.3,1);

  /* 아임웹 본문 폭에 갇히지 않고 화면 전체로 펼친다 */
  position:relative; width:100vw; margin-left:calc(50% - 50vw);
  background:var(--ink); color:var(--tx);
  font-family:var(--kr); -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:break-word; text-align:left;
}
.unad *{box-sizing:border-box}
.unad img,.unad video{max-width:100%;display:block}
.unad a{color:inherit;text-decoration:none}
.unad h1,.unad h2,.unad h3{margin:0;font-weight:inherit;text-wrap:balance}
.unad p,.unad dl,.unad dd,.unad figure{margin:0}
.unad ul{margin:0;padding:0;list-style:none}
.unad :focus-visible{outline:1px solid var(--cyan);outline-offset:4px}

/* ── 공통 레이아웃 ── */
.unad .stage{position:relative;min-height:100svh;display:flex;align-items:center;
  padding-block:clamp(88px,12vh,140px);isolation:isolate;overflow:hidden}
.unad .media{position:absolute;inset:0;z-index:0;overflow:hidden}
.unad .veil{position:absolute;inset:0;z-index:1;pointer-events:none}
.unad .inner{position:relative;z-index:3;width:100%;max-width:1240px;margin:0 auto;
  padding-inline:var(--gut)}

/* ── 공통 타이포 ── */
.unad .kicker{font-family:var(--en);font-size:clamp(10px,.85vw,11.5px);font-weight:400;
  letter-spacing:.42em;text-transform:uppercase;color:var(--cyan)}
.unad .kicker.on-light{color:var(--violet)}
.unad .display{font-family:var(--kr);font-weight:200;letter-spacing:-.055em;line-height:1.28;
  font-size:clamp(34px,5.4vw,66px)}
.unad .display b{font-weight:400}
.unad .en-display{font-family:var(--en);font-weight:100;letter-spacing:-.02em;line-height:1.24;
  font-size:clamp(28px,4.4vw,56px);color:var(--blue-lt)}
.unad .note{font-weight:200;font-size:clamp(13px,1.15vw,16px);line-height:2;
  color:var(--tx-mut);max-width:46ch}

/* ── 스크롤 등장 (지원 브라우저에서만, 아니면 그냥 보인다) ── */
@supports (animation-timeline: view()){
  @media (prefers-reduced-motion: no-preference){
    .unad .rv{animation:unadRise linear both;animation-timeline:view();
      animation-range:entry 2% cover 26%}
    .unad .rv.d1{animation-range:entry 2% cover 31%}
    .unad .rv.d2{animation-range:entry 2% cover 36%}
    .unad .rv.d3{animation-range:entry 2% cover 41%}
    .unad .rv.d4{animation-range:entry 2% cover 46%}
    @keyframes unadRise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
  }
}

/* ── 배경 루프 영상 : 화면에 들어올 때만 내려받고 재생 ── */
.unad .bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--ink)}

/* ══════════ S1 히어로 ══════════ */
.unad .hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:58% 50%}
.unad .hero .veil{background:
  linear-gradient(90deg,rgba(3,8,15,.95) 0%,rgba(3,8,15,.86) 26%,
                  rgba(3,8,15,.55) 44%,rgba(3,8,15,.12) 64%,rgba(3,8,15,0) 78%),
  linear-gradient(180deg,rgba(3,8,15,.66) 0%,rgba(3,8,15,0) 24%,
                  rgba(3,8,15,0) 60%,rgba(3,8,15,.9) 100%)}
.unad .hero-copy{max-width:min(560px,54%)}
.unad .hero-copy .display,.unad .hero-copy .kicker,
.unad .hero-copy .en-line,.unad .hero-copy .hero-meta{
  text-shadow:0 2px 20px rgba(3,8,15,.92),0 0 52px rgba(3,8,15,.7)}
.unad .hero .display{font-size:clamp(32px,4.4vw,56px)}
.unad .hero h1{margin-top:26px}
.unad .hero .en-line{font-family:var(--en);font-size:clamp(10px,1vw,12px);font-weight:200;
  letter-spacing:.46em;color:var(--blue-lt);margin-top:30px}
.unad .hero-meta{margin-top:34px;display:flex;flex-wrap:wrap;gap:9px 26px;font-family:var(--en);
  font-size:10.5px;font-weight:300;letter-spacing:.2em;color:#9FB4D4}
.unad .cue{position:absolute;left:var(--gut);bottom:clamp(26px,5vh,48px);z-index:4;
  font-family:var(--en);font-size:9.5px;letter-spacing:.3em;color:var(--tx-dim);
  display:flex;align-items:center;gap:12px}
.unad .cue::after{content:"";width:1px;height:38px;
  background:linear-gradient(var(--cyan),transparent);animation:unadDrop 2.6s var(--ease) infinite}
@keyframes unadDrop{0%{transform:scaleY(.2);transform-origin:top;opacity:0}
  40%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@media(max-width:880px){
  .unad .hero{align-items:flex-end;padding-block:0 clamp(76px,13vh,120px)}
  .unad .hero .media{inset:0 0 auto 0;height:54svh}
  .unad .hero-bg{object-position:56% 46%}
  .unad .hero .veil{background:linear-gradient(180deg,rgba(3,8,15,.5) 0%,rgba(3,8,15,.12) 20%,
    rgba(3,8,15,.55) 44%,var(--ink) 56%,var(--ink) 100%)}
  .unad .hero-copy{max-width:100%}
  .unad .hero-copy .display,.unad .hero-copy .kicker,
  .unad .hero-copy .en-line,.unad .hero-copy .hero-meta{text-shadow:none}
}

/* ══════════ S2 왜 NAD+인가 ══════════ */
.unad .why .media{background:linear-gradient(180deg,var(--ink),var(--ink2) 60%,var(--ink))}
.unad .why .mol{opacity:.5;mix-blend-mode:screen;filter:saturate(.8) contrast(1.05)}
.unad .why .veil{background:
  linear-gradient(90deg,rgba(3,8,15,.95) 0%,rgba(3,8,15,.62) 52%,rgba(3,8,15,.84) 100%),
  radial-gradient(60% 50% at 78% 62%,rgba(110,79,184,.26),transparent 70%)}
.unad .why-grid{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);
  gap:clamp(30px,5vw,80px);align-items:center}
.unad .why h2{margin-top:22px}
.unad .why .note{margin-top:26px}
.unad .decline{position:relative;border-left:1px solid var(--line);
  padding-left:clamp(20px,3vw,40px);display:grid;gap:clamp(18px,3vh,30px)}
.unad .decline div{display:flex;align-items:baseline;gap:clamp(12px,1.6vw,22px)}
.unad .decline .t{font-family:var(--en);font-size:clamp(20px,2.6vw,34px);font-weight:200;
  letter-spacing:-.02em;color:var(--tx);white-space:nowrap}
.unad .decline .t em{font-style:normal;color:var(--cyan)}
.unad .decline .t.dn em{color:#E0704E}
.unad .decline .s{font-size:clamp(11.5px,1vw,13px);font-weight:200;color:var(--tx-mut)}
.unad .fine{margin-top:26px;font-family:var(--en);font-size:9.5px;letter-spacing:.2em;color:var(--tx-dim)}
@media(max-width:880px){.unad .why-grid{grid-template-columns:1fr}}

/* ══════════ S3 듀얼 융합 (스크롤 고정) ══════════ */
.unad .pin{position:relative;background:var(--ink)}
.unad .pin-track{height:340vh}
.unad .pin-stage{position:sticky;top:0;height:100svh;overflow:hidden;
  display:grid;place-items:center;--p:0;--oA:1;--oB:0;--ring:0;--ringO:0}
.unad .pin-stage::before{content:"";position:absolute;inset:0;
  background:radial-gradient(74% 62% at 50% 50%,rgba(42,85,177,.15),transparent 72%)}
.unad .stream{position:absolute;z-index:1;top:50%;height:min(58vh,460px);width:58vw;
  filter:blur(30px);will-change:transform;pointer-events:none}
.unad .stream i{position:absolute;inset:0;display:block}
.unad .stream.l{left:0;transform:translateY(-50%) translateX(calc(-104% + 104% * var(--p)))}
.unad .stream.r{right:0;transform:translateY(-50%) translateX(calc(104% - 104% * var(--p)))}
.unad .stream.l i{clip-path:polygon(0 40%,100% 6%,100% 94%,0 60%);
  background:linear-gradient(90deg,rgba(169,139,230,0) 0%,rgba(169,139,230,.24) 54%,
    rgba(190,164,248,.66) 86%,rgba(190,164,248,.40) 100%)}
.unad .stream.r i{clip-path:polygon(100% 40%,0 6%,0 94%,100% 60%);
  background:linear-gradient(270deg,rgba(107,166,245,0) 0%,rgba(107,166,245,.24) 54%,
    rgba(146,196,252,.66) 86%,rgba(146,196,252,.40) 100%)}
.unad .scrim{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:4;pointer-events:none;
  width:min(1060px,94vw);height:min(500px,56vh);
  background:radial-gradient(closest-side,rgba(3,8,15,.84) 0%,rgba(3,8,15,.62) 42%,
    rgba(3,8,15,.24) 74%,transparent 100%)}
.unad .core{position:absolute;z-index:3;mix-blend-mode:screen;
  width:min(64vmin,500px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(150,168,255,0) 0%,rgba(150,168,255,.06) 22%,
    rgba(178,190,255,.26) 40%,rgba(130,150,235,.14) 56%,transparent 72%);
  transform:scale(calc(.1 + 1.05 * var(--p)));opacity:calc(var(--p) * .85);
  will-change:transform;pointer-events:none}
.unad .ring{position:absolute;z-index:3;width:min(56vmin,420px);aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(196,222,255,.7);transform:scale(var(--ring));
  opacity:var(--ringO);pointer-events:none}
.unad .slabel{position:absolute;top:50%;transform:translateY(-50%);z-index:4;
  max-width:min(30vw,260px);opacity:var(--oA)}
.unad .slabel.l{left:clamp(22px,5vw,80px)}
.unad .slabel.r{right:clamp(22px,5vw,80px);text-align:right}
.unad .slabel .tg{font-family:var(--en);font-size:10px;font-weight:400;letter-spacing:.3em}
.unad .slabel.l .tg{color:var(--violet)} .unad .slabel.r .tg{color:var(--blue-lt)}
.unad .slabel h3{margin:12px 0 0;font-size:clamp(16px,2vw,24px);font-weight:300;letter-spacing:-.045em}
.unad .slabel p{margin-top:10px;font-size:12px;font-weight:200;line-height:1.85;color:#A9BEDC}
.unad .pin-copy{position:relative;z-index:5;text-align:center;padding-inline:var(--gut);
  max-width:1000px;display:grid;place-items:center}
.unad .pin-copy > *{grid-area:1/1;position:relative}
.unad .pin-copy .en-display,.unad .pin-copy .display,
.unad .pin-copy .note,.unad .pin-copy .kicker{
  text-shadow:0 2px 18px rgba(3,8,15,.9),0 0 48px rgba(3,8,15,.7)}
.unad .phA{opacity:var(--oA)}
.unad .phB{opacity:var(--oB);transform:translateY(calc((1 - var(--oB)) * 24px))}
.unad .phB .en-display{color:#CFE0FF}
.unad .pin-hint{position:absolute;left:50%;bottom:clamp(20px,4vh,40px);transform:translateX(-50%);
  z-index:5;width:min(220px,40vw);height:1px;background:rgba(150,185,240,.2)}
.unad .pin-hint i{display:block;height:100%;width:calc(var(--p) * 100%);
  background:linear-gradient(90deg,var(--violet),var(--blue-lt))}
.unad .pin-hint span{position:absolute;left:50%;top:14px;transform:translateX(-50%);

@media(max-width:720px){
  .unad .pin-track{height:300vh}

  .unad .slabel{max-width:44vw}
  .unad .slabel h3{font-size:15px} .unad .slabel p{display:none}
}
/* 고정이 먹히지 않는 환경(감싼 요소에 overflow가 걸린 경우)이나
   모션 최소화 설정에서는 고정을 풀고 합쳐진 최종 상태로 보여준다 */
.unad.nopin .pin-track{height:auto}
.unad.nopin .pin-stage{position:relative;height:auto;min-height:100svh;padding-block:18vh;
  --p:1;--oA:0;--oB:1;--ring:0;--ringO:0}
.unad.nopin .slabel,.unad.nopin .pin-hint{display:none}
@media (prefers-reduced-motion: reduce){
  .unad .pin-track{height:auto}
  .unad .pin-stage{position:relative;height:auto;min-height:100svh;padding-block:18vh;
    --p:1;--oA:0;--oB:1;--ring:0;--ringO:0}
  .unad .slabel,.unad .pin-hint{display:none}
}

/* ══════════ S4 포뮬러 ══════════ */
.unad .formula{background:var(--ink);min-height:auto;padding-block:clamp(72px,9vh,112px)}
.unad .formula .media{background:
  radial-gradient(54% 42% at 86% 4%,rgba(139,106,214,.30),transparent 70%),

.unad .f-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);

.unad .f-model{position:relative;display:flex;flex-direction:column;align-items:center}

.unad .f-model img{position:relative;width:100%;height:clamp(340px,50vh,510px);

@media(max-width:820px){.unad .ing{grid-template-columns:repeat(2,minmax(0,1fr))}}

.unad .exo{margin-top:clamp(24px,3.4vh,40px);position:relative;color:var(--tx);

/* ══════════ S5 제품·문의 ══════════ */
.unad .end{position:relative;background:var(--ink);padding-block:clamp(80px,12vh,140px);
  overflow:hidden;isolation:isolate}
.unad .end .media{position:absolute;inset:0;z-index:0;overflow:hidden}

.unad .end .veil{z-index:1;background:

<script>
/* ═══════════════════════════════════════════════════════════
   ULTRA NAD+ 위젯 공통 스크립트
   블록이 몇 개든, 순서가 어떻든 한 번만 초기화되고
   새로 추가된 블록은 자동으로 다시 잡아냅니다.
   ═══════════════════════════════════════════════════════════ */
(function(){
  if (window.UNAD && window.UNAD.ready) { window.UNAD.scan(); return; }

  var U = window.UNAD = window.UNAD || {};
  U.ready = true;

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function clamp(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function base(){ return (U.base || '').replace(/\/?$/, '/'); }

  /* ── 미디어 주소 연결 ──
     마크업에는 파일 이름만 적고, 실제 주소는 UNAD.base 하나로 관리한다. */
  function resolve(root){
    root.querySelectorAll('img[data-img]:not([data-done])').forEach(function(img){
      img.src = base() + img.dataset.img;
      if (img.dataset.imgSm) img.srcset = base() + img.dataset.imgSm + ' 960w, ' + img.src + ' 1920w';
      img.setAttribute('data-done','1');
    });
  }

  /* ── 배경 루프 영상 ── */
  function tryPlay(v){ if (reduce) return; var q = v.play(); if (q && q.catch) q.catch(function(){}); }
  function pickSrc(v){
    var p = document.createElement('video'), n = base() + v.dataset.file;
    if (p.canPlayType('video/webm; codecs="vp9"')) return n + '.webm';
    return n + '.mp4';
  }
  /* 첫 프레임 이미지는 코드에 들어 있어 따로 올릴 필요가 없다 */
  function poster(name){
    return (U.posters && U.posters[name]) || (base() + name + '.jpg');
  }
  var vo = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){
    es.forEach(function(e){
      var v = e.target;
      if (e.isIntersecting){
        if (!v.src){
          v.poster = poster(v.dataset.file);
          v.src = pickSrc(v);
          v.addEventListener('loadeddata', function(){ tryPlay(v); }, {once:true});
          v.load();
        }
        tryPlay(v);
      } else if (!v.paused) { v.pause(); }
    });
  }, {rootMargin:'300px 0px'}) : null;

  var vids = [];
  function bindVideos(root){
    root.querySelectorAll('video[data-file]:not([data-done])').forEach(function(v){
      v.setAttribute('data-done','1'); vids.push(v);
      v.poster = poster(v.dataset.file);
      if (vo) vo.observe(v);
      else { v.src = pickSrc(v); tryPlay(v); }
    });
  }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) vids.forEach(function(v){ v.pause(); });
  });

  /* ── 듀얼 융합 : 스크롤 진행도를 CSS 변수로 넘긴다 ── */
  var pins = [];
  function bindPins(root){
    root.querySelectorAll('.pin:not([data-done])').forEach(function(pin){
      pin.setAttribute('data-done','1');
      var stage = pin.querySelector('.pin-stage');
      if (!stage) return;
      /* 감싼 요소에 overflow가 걸려 있으면 position:sticky가 동작하지 않는다.
         그런 환경에서는 고정을 포기하고 합쳐진 최종 화면을 그대로 보여준다. */
      var el = pin.parentElement, blocked = false;
      while (el && el !== document.body){
        var ov = getComputedStyle(el);
        if (ov.overflow !== 'visible' || ov.overflowY !== 'visible'){ blocked = true; break; }
        el = el.parentElement;
      }
      if (blocked || reduce){ pin.closest('.unad').classList.add('nopin'); return; }
      pins.push({pin:pin, stage:stage});
    });
  }
  function pinUpdate(){
    pins.forEach(function(o){
      var total = o.pin.offsetHeight - window.innerHeight;
      var p = total > 0 ? clamp(-o.pin.getBoundingClientRect().top / total) : 1;
      var e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
      var rp = clamp((p - .62)/.26);
      o.stage.style.setProperty('--p', e.toFixed(4));
      o.stage.style.setProperty('--oA', (1 - clamp((p - .16)/.22)).toFixed(3));
      o.stage.style.setProperty('--oB', clamp((p - .58)/.24).toFixed(3));
      o.stage.style.setProperty('--ring', (0.35 + rp*2.7).toFixed(3));
      o.stage.style.setProperty('--ringO', (rp < .002 ? 0 : (1 - rp) * .5).toFixed(3));
    });
  }

  /* ── 핵심 효과 : 화면 가운데 오는 줄을 강조 ── */
  var rowSets = [];
  function bindRows(root){
    root.querySelectorAll('.bene-list:not([data-done])').forEach(function(l){
      l.setAttribute('data-done','1');
      rowSets.push([].slice.call(l.children));
    });
  }
  function rowsUpdate(){
    rowSets.forEach(function(rows){
      var mid = window.innerHeight * 0.52, best = -1, bd = 1e9;
      rows.forEach(function(r,i){
        var b = r.getBoundingClientRect();
        if (b.bottom < 0 || b.top > window.innerHeight) return;
        var d = Math.abs((b.top + b.bottom)/2 - mid);
        if (d < bd){ bd = d; best = i; }
      });
      rows.forEach(function(r,i){ r.classList.toggle('on', i === best && bd < window.innerHeight*0.34); });
    });
  }

  var tick = false;
  function onScroll(){
    if (tick) return; tick = true;
    requestAnimationFrame(function(){ pinUpdate(); rowsUpdate(); tick = false; });
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);

  /* ── 자가 진단 ──
     파일 주소가 잘못되면 화면이 텅 빈 채로 원인을 알기 어렵다.
     이미지 하나를 시험 삼아 불러보고 실패하면 콘솔에 분명히 알린다. */
  function diagnose(){
    if (U.checked) return; U.checked = true;
    if (!U.base || U.base.indexOf('여기에') >= 0){
      console.error('[ULTRA NAD+] 공통 코드의 window.UNAD.base 를 실제 파일 폴더 주소로 바꿔주세요.');
      return;
    }
    var t = new Image();
    t.onerror = function(){
      console.error('[ULTRA NAD+] 파일을 불러오지 못했습니다. 주소를 확인하세요 → ' + base() + 'hero_shot.jpg');
    };
    t.src = base() + 'hero_shot.jpg';
  }

  U.scan = function(){
    diagnose();
    var root = document;
    resolve(root); bindVideos(root); bindPins(root); bindRows(root);
    onScroll();
  };
  U.scan();
  /* 아임웹 편집기에서 블록이 나중에 그려지는 경우까지 대비 */
  window.addEventListener('load', U.scan);
  setTimeout(U.scan, 600);
  setTimeout(U.scan, 2000);
})();

</script>
